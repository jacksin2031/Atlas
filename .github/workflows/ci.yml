name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.80"

jobs:
  rust-build:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --workspace --all-targets

  python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run unit tests
        run: pytest tests/unit tests/common tests/events tests/execution tests/graph tests/health tests/metrics tests/node_registry tests/parser tests/scheduler tests/storage tests/validator tests/runtime -v

  python-integration:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run integration tests
        run: pytest tests/integration tests/plugin_integration -v

  python-e2e:
    name: Python E2E Tests
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run e2e tests
        run: pytest tests/e2e -v

  conformance:
    name: Conformance Validation
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run conformance suite
        run: pytest tests/conformance -v

  architecture-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate architecture
        run: python -m pytest tests/conformance/test_architecture_validator.py -v

  rfc-validation:
    name: RFC Validation
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate RFC compliance
        run: python -m pytest tests/conformance/test_rfc_validator.py -v

  documentation-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    needs: rust-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate documentation
        run: python -m pytest tests/conformance/test_documentation_validator.py -v

  conformance-report:
    name: Generate Conformance Report
    runs-on: ubuntu-latest
    needs:
      - conformance
      - architecture-validation
      - rfc-validation
      - documentation-validation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Generate conformance report
        run: python -m pytest tests/conformance/test_cli.py -v --tb=short

      - name: Upload conformance artifact
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            docs/**/COMPLIANCE_REPORT.md
            docs/**/*_COMPLIANCE_REPORT.md
          retention-days: 30

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - rust-build
      - python-unit
      - python-integration
      - python-e2e
      - conformance
      - architecture-validation
      - rfc-validation
      - documentation-validation
      - conformance-report
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for job in "${{ toJSON(needs) }}"; do
            echo "- Job: $job — Status: ${{ needs.job.result }}"
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All jobs completed." >> $GITHUB_STEP_SUMMARY
