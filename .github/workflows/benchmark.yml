name: Benchmark

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      benchmark_target:
        description: "Benchmark target"
        required: false
        type: choice
        options:
          - all
          - startup
          - shutdown
          - memory
          - plugin-load
          - workflow
          - vision
          - ai
        default: all

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "src"

jobs:
  python-benchmarks:
    name: Python Benchmarks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Startup benchmark
        run: |
          echo "## Python Startup Benchmark"
          START=$(date +%s%N)
          python -c "import sys; sys.path.insert(0,'src'); from atlas_workflow import *; print('Workflow loaded')" 2>/dev/null || echo "Import skipped"
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Startup time: ${ELAPSED}ms"

      - name: Workflow benchmark
        run: |
          echo "## Python Workflow Benchmark"
          START=$(date +%s%N)
          python -c "import sys; sys.path.insert(0,'src'); from atlas_workflow import *; print('Workflow loaded')" 2>/dev/null || echo "Workflow test skipped"
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Workflow init time: ${ELAPSED}ms"

      - name: Conformance benchmark
        run: |
          echo "## Conformance Suite Benchmark"
          START=$(date +%s%N)
          python -m pytest tests/conformance/ -v --tb=short -q 2>/dev/null || echo "Conformance test skipped"
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Conformance suite: ${ELAPSED}ms"

  rust-benchmarks:
    name: Rust Benchmarks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80"

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: |
          echo "## Rust Build Benchmark"
          START=$(date +%s%N)
          cargo build --workspace --quiet 2>/dev/null
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Build time: ${ELAPSED}ms"

      - name: Test workspace
        run: |
          echo "## Rust Test Benchmark"
          START=$(date +%s%N)
          cargo test --workspace --quiet 2>/dev/null
          END=$(date +%s%N)
          ELAPSED=$(( (END - START) / 1000000 ))
          echo "Test execution: ${ELAPSED}ms"

  benchmark-summary:
    name: Benchmark Summary
    runs-on: ubuntu-22.04
    needs: [rust-benchmarks, python-benchmarks]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "# Benchmark Results"
          echo ""
          echo "| Category | Status |"
          echo "|----------|--------|"
          echo "| Rust Build | ${{ needs.rust-benchmarks.result == 'success' && 'OK' || 'FAIL' }} |"
          echo "| Rust Tests | ${{ needs.rust-benchmarks.result == 'success' && 'OK' || 'FAIL' }} |"
          echo "| Python Startup | ${{ needs.python-benchmarks.result == 'success' && 'OK' || 'FAIL' }} |"
          echo "| Workflow | ${{ needs.python-benchmarks.result == 'success' && 'OK' || 'FAIL' }} |"
          echo "| Conformance | ${{ needs.python-benchmarks.result == 'success' && 'OK' || 'FAIL' }} |"