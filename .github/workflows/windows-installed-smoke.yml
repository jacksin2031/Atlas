name: Windows Installed-Product Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installed-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-smoke:
    name: Fresh Windows installer smoke
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.9.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install locked frontend dependencies
        working-directory: apps/atlas-desktop
        run: pnpm install --frozen-lockfile

      - name: Validate real-machine acceptance harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/real_machine_acceptance.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Real-machine acceptance harness has PowerShell parse errors'
          }
          & ./scripts/real_machine_acceptance.ps1 -PlanOnly | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prime complete locked Rust dependency metadata
        run: cargo fetch --locked --manifest-path apps/atlas-desktop/src-tauri/Cargo.toml

      - name: Bundle pinned production runtime
        run: |
          python scripts/bundle_runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/bundle_notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build NSIS candidate
        working-directory: apps/atlas-desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Silent install into Unicode and space path
        id: install
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'apps/atlas-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installer = @(Get-ChildItem -LiteralPath $bundle -Filter '*.exe')
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer, got $($installer.Count)" }

          $installDir = Join-Path $env:RUNNER_TEMP 'Atlas 驗收 日本語 Space'
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          $arguments = "/S /D=$installDir"
          $proc = Start-Process -FilePath $installer[0].FullName -ArgumentList $arguments -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed: $($proc.ExitCode)" }

          $exe = Join-Path $installDir 'atlas-desktop.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            $found = @(Get-ChildItem -LiteralPath $installDir -Filter '*.exe' -File -ErrorAction SilentlyContinue)
            throw "Installed desktop executable missing at $exe; found: $($found.Name -join ', ')"
          }

          $runtime = Join-Path $installDir 'runtime/python.exe'
          if (-not (Test-Path -LiteralPath $runtime)) {
            throw "Bundled python.exe missing at $runtime"
          }

          "install_dir=$installDir" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "sha256=$((Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT

      - name: Verify installed runtime is repository-independent
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.install.outputs.install_dir }}
        run: |
          $runtime = Join-Path $env:INSTALL_DIR 'runtime/python.exe'
          $oldPath = $env:PATH
          $oldLocation = Get-Location
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $outside = Join-Path $env:RUNNER_TEMP 'outside-repository'
            New-Item -ItemType Directory -Force -Path $outside | Out-Null
            Set-Location $outside
            & $runtime -I -B -c "import atlas_workflow, atlas_ai, atlas_knowledge; print('ATLAS_BUNDLED_RUNTIME_OK')"
            if ($LASTEXITCODE -ne 0) {
              throw 'Bundled runtime import smoke failed outside checkout'
            }
          } finally {
            Set-Location $oldLocation
            $env:PATH = $oldPath
          }

      - name: Launch installed desktop without development PATH
        shell: pwsh
        env:
          ATLAS_EXE: ${{ steps.install.outputs.exe }}
          INSTALL_DIR: ${{ steps.install.outputs.install_dir }}
        run: |
          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:INSTALL_DIR"

            function Assert-NoAtlasOrphans {
              $orphans = @(Get-CimInstance Win32_Process | Where-Object {
                $_.ExecutablePath -and
                $_.ExecutablePath.StartsWith($env:INSTALL_DIR, [StringComparison]::OrdinalIgnoreCase) -and
                $_.Name -match '^(python(w)?|atlas-desktop)\.exe$'
              })
              if ($orphans.Count -gt 0) {
                throw "Installed Atlas left orphan processes: $($orphans.ProcessId -join ', ')"
              }
            }

            for ($cycle = 1; $cycle -le 10; $cycle++) {
              $p = $null
              $failure = $null
              try {
                $p = Start-Process -FilePath $env:ATLAS_EXE -WorkingDirectory $env:RUNNER_TEMP -PassThru
                Start-Sleep -Seconds $(if ($cycle -eq 1) { 8 } else { 3 })

                if ($p.HasExited) {
                  throw "Installed Atlas exited early during cycle $cycle with code $($p.ExitCode)"
                }

                if ($cycle -eq 1) {
                  $children = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id })
                  $bad = @($children | Where-Object {
                    if (-not $_.ExecutablePath) { return $false }
                    if ($_.ExecutablePath.StartsWith($env:INSTALL_DIR, [StringComparison]::OrdinalIgnoreCase)) { return $false }

                    $name = [IO.Path]::GetFileName($_.ExecutablePath)
                    $systemConhost =
                      $name -ieq 'conhost.exe' -and
                      $_.ExecutablePath.StartsWith($env:SystemRoot, [StringComparison]::OrdinalIgnoreCase)
                    $webview =
                      $name -ieq 'msedgewebview2.exe' -and
                      $_.ExecutablePath -match '\\Microsoft\\EdgeWebView\\Application\\'

                    return -not ($systemConhost -or $webview)
                  })

                  if ($bad.Count -gt 0) {
                    throw "Atlas spawned unexpected child outside install directory: $($bad.ExecutablePath -join ', ')"
                  }

                  $outsidePython = @($children | Where-Object {
                    $_.Name -match '^python(w)?\.exe$' -and
                    $_.ExecutablePath -and
                    -not $_.ExecutablePath.StartsWith($env:INSTALL_DIR, [StringComparison]::OrdinalIgnoreCase)
                  })
                  if ($outsidePython.Count -gt 0) {
                    throw "Atlas used Python outside install directory: $($outsidePython.ExecutablePath -join ', ')"
                  }
                }
              } catch {
                $failure = $_
              } finally {
                if ($p -and -not $p.HasExited) {
                  Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                }
              }

              Start-Sleep -Seconds 2
              Assert-NoAtlasOrphans
              if ($failure) { throw $failure }
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Silent uninstall
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: pwsh
        env:
          INSTALL_DIR: ${{ steps.install.outputs.install_dir }}
        run: |
          $uninstaller = Join-Path $env:INSTALL_DIR 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller)) {
            throw 'NSIS uninstaller missing'
          }

          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            throw "Uninstaller failed: $($p.ExitCode)"
          }

          Start-Sleep -Seconds 2
          if (Test-Path -LiteralPath (Join-Path $env:INSTALL_DIR 'atlas-desktop.exe')) {
            throw 'Desktop executable remains after uninstall'
          }

      - name: Write candidate metadata
        if: ${{ success() }}
        shell: pwsh
        env:
          INSTALLER_SHA256: ${{ steps.install.outputs.sha256 }}
        run: |
          $bundle = Resolve-Path 'apps/atlas-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          @{
            commit = '${{ github.sha }}'
            workflowRun = '${{ github.run_id }}'
            target = 'x86_64-pc-windows-msvc'
            signing = 'unsigned'
            installerSha256 = $env:INSTALLER_SHA256
            hostedWindowsSmoke = 'PASS'
            interactiveRealMachineAcceptance = 'NOT ESTABLISHED'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $bundle 'smoke-metadata.json')

      - name: Upload accepted installer candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Windows-smoke-${{ github.sha }}
          path: apps/atlas-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          if-no-files-found: error
          retention-days: 7

      - name: Record smoke scope
        if: ${{ success() }}
        shell: pwsh
        run: |
          @'
          Fresh GitHub-hosted Windows VM smoke passed only if this job is green.
          This validates build, Unicode/space silent install, bundled-runtime imports outside the checkout,
          launch without development PATH, trusted-host-aware child-process containment,
          ten launch/forced-close cycles with orphan cleanup, and silent uninstall.
          It does NOT establish interactive GUI, Input, mixed-DPI, accessibility,
          or full real-machine acceptance.
          '@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
