name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.10.0-alpha)"
        required: true
        type: string
        default: ""

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "src"
  RUST_TOOLCHAIN: "1.80"

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.version }}

      - name: Verify tag format
        run: |
          TAG="${{ github.event.release.tag_name || inputs.version }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc\.[0-9]+)$ ]]; then
            echo "::error::Invalid tag format: $TAG. Expected: vX.Y.Z-alpha, vX.Y.Z-beta, or vX.Y.Z-rc.N"
            exit 1
          fi
          echo "Tag format valid: $TAG"

      - name: Verify tag matches version docs
        run: |
          TAG="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${TAG#v}"
          if ! grep -q "$VERSION" CHANGELOG.md; then
            echo "::error::Version $VERSION not found in CHANGELOG.md"
            exit 1
          fi
          if ! grep -q "$VERSION" ROADMAP.md; then
            echo "::error::Version $VERSION not found in ROADMAP.md"
            exit 1
          fi
          echo "Version $VERSION verified in documentation"

  rust-release:
    name: Rust Release Build
    runs-on: ubuntu-22.04
    needs: validate-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --workspace --release

      - name: Run release tests
        run: cargo test --workspace

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: rust-release-binaries
          path: target/release/
          retention-days: 30

  python-tests:
    name: Python Release Tests
    runs-on: ubuntu-22.04
    needs: validate-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run full test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Run conformance suite
        run: python -m pytest tests/conformance/ -v --tb=short

  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-22.04
    needs: [rust-release, python-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          TAG="${{ github.event.release.tag_name || inputs.version }}"
          VERSION="${TAG#v}"
          echo "# Release $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if grep -A 100 "## \[$VERSION" CHANGELOG.md | head -50; then
            echo "Changelog section found"
          else
            echo "No changelog section found for $VERSION"
          fi

  summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    needs: [validate-release, rust-release, python-tests, generate-release-notes]
    if: always()
    steps:
      - name: Release Result
        run: |
          echo "# Release Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validate | ${{ needs.validate-release.result == 'success' && 'OK' || 'FAIL' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rust Build | ${{ needs.rust-release.result == 'success' && 'OK' || 'FAIL' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python Tests | ${{ needs.python-tests.result == 'success' && 'OK' || 'FAIL' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release Notes | ${{ needs.generate-release-notes.result == 'success' && 'OK' || 'FAIL' }} |" >> "$GITHUB_STEP_SUMMARY"