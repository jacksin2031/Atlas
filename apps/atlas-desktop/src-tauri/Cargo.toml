[package]
name = "atlas-desktop"
version = "0.15.0-alpha"
description = "Atlas Desktop Shell"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "atlas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
