name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'VERSIONING.md'
      - 'RELEASE.md'
      - 'PROJECT_STATUS.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  markdown-links:
    name: Broken Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install link checker
        run: pip install markdown-link-check

      - name: Check README links
        run: |
          echo "## README.md Link Check" > links-result.md
          echo "" >> links-result.md
          npx markdown-link-check@latest README.md 2>&1 || true >> links-result.md

      - name: Check docs links
        run: |
          echo "" >> links-result.md
          echo "## docs/ Link Check" >> links-result.md
          echo "" >> links-result.md
          find docs -name "*.md" -exec npx markdown-link-check@latest {} \; 2>&1 || true >> links-result.md

      - name: Upload link check results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-check-results
          path: links-result.md
          retention-days: 7

  documentation-consistency:
    name: Documentation Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate documentation
        run: python -m pytest tests/conformance/test_documentation_validator.py -v --tb=short

      - name: Check version consistency
        run: |
          echo "## Version Consistency Check"
          VERSIONS=$(grep -rh "0\.[0-9]\+\.[0-9]\+-alpha" . --include="*.md" | sort -u)
          echo "Versions found:"
          echo "$VERSIONS"
          echo ""
          echo "Checking CHANGELOG.md..."
          grep -c "## \[" CHANGELOG.md || echo "WARN: No version sections in CHANGELOG.md"
          echo "Checking ROADMAP.md..."
          grep -c "### Sprint" ROADMAP.md || echo "WARN: No sprint sections in ROADMAP.md"

  compliance-reports:
    name: Compliance Report Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate compliance reports exist
        run: |
          echo "## Compliance Report Check"
          REPORTS=(
            "docs/ARCHITECTURE.md"
            "docs/README.md"
            "docs/project/PROJECT_COMPLIANCE_REPORT.md"
            "docs/ai/AI_COMPLIANCE_REPORT.md"
            "docs/knowledge/KNOWLEDGE_COMPLIANCE_REPORT.md"
            "docs/vision/VISION_COMPLIANCE_REPORT.md"
          )
          for report in "${REPORTS[@]}"; do
            if [ -f "$report" ]; then
              echo "✅ $report exists"
            else
              echo "⚠️  $report not found"
            fi
          done

  readme-format:
    name: README.md Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate README structure
        run: |
          echo "## README.md Validation"
          REQUIRED_SECTIONS=("## Vision" "## Goals" "## Current Status" "## Architecture" "## Implemented Modules" "## Quick Start" "## Repository Structure" "## Documentation" "## License")
          for section in "${REQUIRED_SECTIONS[@]}"; do
            if grep -q "^$section" README.md; then
              echo "✅ Found: $section"
            else
              echo "⚠️  Missing: $section"
            fi
          done

  summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    needs: [markdown-links, documentation-consistency, compliance-reports, readme-format]
    if: always()
    steps:
      - name: Doc Check Summary
        run: |
          echo "## Documentation Pipeline Summary"
          echo ""
          echo "| Check | Status |"
          echo "|-------|--------|"
          echo "| Broken Links | ${{ needs.markdown-links.result == 'success' && '✅' || '❌' }} |"
          echo "| Consistency | ${{ needs.documentation-consistency.result == 'success' && '✅' || '❌' }} |"
          echo "| Compliance | ${{ needs.compliance-reports.result == 'success' && '✅' || '❌' }} |"
          echo "| README Format | ${{ needs.readme-format.result == 'success' && '✅' || '❌' }} |"
