name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "src"
  RUST_TOOLCHAIN: "1.80"

jobs:
  rust-build:
    name: Rust Build and Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Build workspace
        run: cargo build --workspace

      - name: Clippy check
        run: cargo clippy --workspace -- -A warnings

      - name: Format check
        run: cargo fmt --all --check

      - name: Run workspace tests
        run: cargo test --workspace

  python-tests:
    name: Python Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run unit tests (skip if empty)
        run: |
          if python -m pytest tests/unit/ --collect-only -q 2>/dev/null | grep -q "tests collected"; then
            python -m pytest tests/unit/ -v --tb=short -q
          else
            echo "No unit tests found in tests/unit/ (directory empty or .gitkeep only)"
          fi

      - name: Run integration tests
        run: python -m pytest tests/integration/ -v --tb=short -q

      - name: Run conformance tests
        run: python -m pytest tests/conformance/ -v --tb=short -q

  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [rust-build, python-tests]
    if: always()
    steps:
      - name: CI Summary
        run: |
          echo "# CI Pipeline Summary"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| Rust Build | ${{ needs.rust-build.result == 'success' && 'OK' || 'FAIL' }} |"
          echo "| Python Tests | ${{ needs.python-tests.result == 'success' && 'OK' || 'FAIL' }} |"