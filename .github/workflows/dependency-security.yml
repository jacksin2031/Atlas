name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "apps/atlas-desktop/package.json"
      - "apps/atlas-desktop/pnpm-lock.yaml"
      - ".github/workflows/dependency-security.yml"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "apps/atlas-desktop/package.json"
      - "apps/atlas-desktop/pnpm-lock.yaml"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rustsec:
    name: RustSec
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit root Rust lockfile
        run: cargo audit
      - name: Trace vulnerable desktop transitive dependency
        working-directory: apps/atlas-desktop/src-tauri
        run: cargo tree -i quick-xml@0.28.2 || true
      - name: Audit desktop Rust lockfile
        working-directory: apps/atlas-desktop/src-tauri
        run: cargo audit

  frontend:
    name: Frontend dependency audit
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/atlas-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/atlas-desktop/pnpm-lock.yaml
      - name: Refresh patched dependency resolutions
        run: pnpm update postcss nanoid browserslist vitest baseline-browser-mapping --lockfile-only --depth Infinity
      - name: Commit refreshed lockfile on same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh audited frontend lockfile"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload refreshed lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: patched-frontend-lockfile
          path: apps/atlas-desktop/pnpm-lock.yaml
          retention-days: 7
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate
      - name: Audit full dependency graph
        run: pnpm audit --audit-level moderate
