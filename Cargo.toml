[workspace]
resolver = "2"
members = [
    "packages/contracts",
    "packages/common",
    "packages/runtime",
    "packages/storage",
    "packages/plugin",
    "packages/ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "=1.10.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"

[workspace.lints.clippy]
all = { level = "warn" }
pedantic = { level = "warn" }

