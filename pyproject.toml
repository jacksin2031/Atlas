[project]
name = "atlas-workflow"
version = "1.0.0"
description = "Atlas Workflow Runtime — Python Reference Implementation. The architecture is platform-independent; production targets Rust."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
