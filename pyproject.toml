[project]
name = "atlas-workflow"
version = "0.12.0a0"
description = "Atlas Workflow Runtime — Python reference implementation. The architecture is platform-independent; production targets Rust."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[project.scripts]
atlas-conformance = "atlas_conformance.cli:main"
