name: Pull Request Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

env:
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.80"

jobs:
  architecture-check:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate architecture constraints
        run: python -m pytest tests/conformance/test_architecture_validator.py -v --tb=short

      - name: Check forbidden imports
        run: python -m pytest tests/conformance/test_module_validator.py -v --tb=short

  rfc-check:
    name: RFC Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate RFC compliance
        run: python -m pytest tests/conformance/test_rfc_validator.py -v --tb=short

  adr-check:
    name: ADR Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate ADRs
        run: python -m pytest tests/conformance/test_adr_validator.py -v --tb=short

  documentation-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Validate documentation
        run: python -m pytest tests/conformance/test_documentation_validator.py -v --tb=short

      - name: Check for TODOs and placeholders
        run: |
          echo "## TODO/Placeholder Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          $todos = Select-String -Path "**/*.py","**/*.rs" -Pattern "TODO|FIXME|HACK|XXX" -SimpleMatch -ErrorAction SilentlyContinue
          if ($todos) {
            echo "⚠️ Found TODOs/FIXMEs:" >> $GITHUB_STEP_SUMMARY
            foreach ($todo in $todos) {
              echo "- \`$($todo.Path):$($todo.LineNumber)\` - $($todo.Line.Trim())" >> $GITHUB_STEP_SUMMARY
            }
          } else {
            echo "✅ No TODOs, FIXMEs, HACKs, or XXXs found." >> $GITHUB_STEP_SUMMARY
          }

  tests:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run all Python tests
        run: pytest tests/ -v --tb=short --color=yes

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

  conformance:
    name: Conformance Suite
    runs-on: ubuntu-latest
    needs: [architecture-check, rfc-check, adr-check, documentation-check, tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Run full conformance suite
        run: python -m pytest tests/conformance/ -v --tb=short

      - name: Upload conformance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-conformance-results
          path: |
            docs/**/*_COMPLIANCE_REPORT.md
          retention-days: 7

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [architecture-check, rfc-check, adr-check, documentation-check, tests, conformance]
    if: always()
    steps:
      - name: PR Check Summary
        run: |
          echo "## Pull Request Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ needs.architecture-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RFC Compliance | ${{ needs.rfc-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ADR Validation | ${{ needs.adr-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.documentation-check.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Conformance | ${{ needs.conformance.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          $allPassed = $needs.architecture-check.result -eq 'success' -and
                       $needs.rfc-check.result -eq 'success' -and
                       $needs.adr-check.result -eq 'success' -and
                       $needs.documentation-check.result -eq 'success' -and
                       $needs.tests.result -eq 'success' -and
                       $needs.conformance.result -eq 'success'
          if ($allPassed) {
            echo "🎉 **All checks passed.** Ready for review." >> $GITHUB_STEP_SUMMARY
          } else {
            echo "⚠️ **Some checks failed.** Please fix before merging." >> $GITHUB_STEP_SUMMARY
          }
